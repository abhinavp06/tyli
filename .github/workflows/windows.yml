name: Windows build

# Builds TYLI on Windows (MSVC 2022, Qt 6.12) together with hoardor from its public
# repository, runs the tests, and uploads a ready-to-run zip: tyli.exe plus the Qt
# libraries and the MSVC runtime next to it. Download it from the run's "Artifacts".
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      QT_VERSION: 6.12.0
      QT_ARCH: win64_msvc2022_64
      QT_DIR_NAME: msvc2022_64
      # hoardor reads metadata with ffmpeg (LGPL, shared). A pinned BtbN build, checked by its SHA-256.
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-01-13-06/ffmpeg-n8.1.3-14-g330caae0c1-win64-lgpl-shared-8.1.zip
      FFMPEG_SHA256: bf545d8fee9bb6957c1f3dea0f384bf64edead407d763326dbbd2de1b04768a4
      # hoardor plays audio and video with libmpv (hoardor features/player.md §9). A pinned
      # shinchiro "dev" build (headers + libmpv-2.dll; GPL: it bundles GPL parts), checked by its SHA-256.
      MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261003/mpv-dev-x86_64-20261003-git-3186d369f9.7z
      MPV_SHA256: b8c2d656c1584d5f08196fcee5c2d0783d1f76021897c4e0b3cc30f94c79522e

    steps:
      - name: Check out TYLI
        uses: actions/checkout@v4
        with:
          path: tyli

      # TYLI builds hoardor from the sibling folder (add_subdirectory(../hoardor)).
      - name: Check out hoardor (the same branch name if it exists, otherwise master)
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/abhinavp06/hoardor.git "$branch" > /dev/null; then
            ref="$branch"
          else
            ref=master
          fi
          echo "hoardor branch: $ref"
          git clone --depth 1 --branch "$ref" https://github.com/abhinavp06/hoardor.git hoardor

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-v2

      # Our own small installer: aqtinstall 3.3.0 can't find Qt 6.12 for Windows, whose
      # packages moved to per-compiler folders (see the script's header).
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python tyli/.github/scripts/install_qt.py --version "$env:QT_VERSION" --arch "$env:QT_ARCH" --out "$env:RUNNER_TEMP/Qt" --addons qttasktree

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}

      - name: Install ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "ffmpeg download has SHA-256 $hash, expected $env:FFMPEG_SHA256" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-unpacked"
          $top = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-unpacked" -Directory | Select-Object -First 1
          Move-Item $top.FullName "$env:RUNNER_TEMP\ffmpeg"

      # Puts cl.exe, link.exe, and the Windows SDK on PATH (a "Developer Command Prompt").
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache libmpv
        id: mpv-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mpv
          key: mpv-${{ env.MPV_SHA256 }}-v1

      # The package has a MinGW import library only, so MSVC's mpv.lib is made from the DLL's
      # exports (dumpbin, then lib /def). After "Set up MSVC": both tools come from it.
      - name: Install libmpv
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mpv-dev.7z"
          Invoke-WebRequest -Uri $env:MPV_URL -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MPV_SHA256) { throw "libmpv download has SHA-256 $hash, expected $env:MPV_SHA256" }
          $mpv = "$env:RUNNER_TEMP\mpv"
          & 7z x $archive "-o$mpv\unpacked" -y | Out-Null
          New-Item -ItemType Directory "$mpv\bin", "$mpv\lib" | Out-Null
          Move-Item "$mpv\unpacked\include" "$mpv\include"
          Move-Item "$mpv\unpacked\libmpv-2.dll" "$mpv\bin\libmpv-2.dll"
          $names = & dumpbin /exports "$mpv\bin\libmpv-2.dll" | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)$') { $Matches[1] }
          }
          if (-not ($names -contains 'mpv_create')) { throw "libmpv-2.dll exports no mpv_create" }
          Set-Content "$mpv\lib\mpv.def" (@('LIBRARY libmpv-2', 'EXPORTS') + $names)
          & lib /nologo /def:"$mpv\lib\mpv.def" /machine:x64 /out:"$mpv\lib\mpv.lib"
          if ($LASTEXITCODE -ne 0) { throw "lib /def failed" }
          Write-Host "mpv.lib made with $($names.Count) exports"

      # PowerShell, not Git Bash: Git Bash has its own link.exe that would shadow MSVC's linker.
      - name: Configure
        shell: pwsh
        run: cmake -S tyli -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/$env:QT_VERSION/$env:QT_DIR_NAME" "-DFFMPEG_ROOT=$env:RUNNER_TEMP/ffmpeg" "-DMPV_ROOT=$env:RUNNER_TEMP/mpv"

      - name: Build
        id: build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\$env:QT_DIR_NAME\bin;$env:RUNNER_TEMP\ffmpeg\bin;$env:RUNNER_TEMP\mpv\bin;$env:PATH"
          ctest --test-dir build --output-on-failure

      # Runs even when a test failed, so the exe can still be tried.
      - name: Package
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/tyli.exe dist/
          & "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\$env:QT_DIR_NAME\bin\windeployqt.exe" --release --no-translations --qmldir tyli/qml dist/tyli.exe
          # The MSVC runtime next to the exe ("app-local"), so it runs without installing the VC++ redistributable.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if ($crt) { Copy-Item "$($crt.FullName)\*.dll" dist/ }
          # ffmpeg's libraries hoardor links (avformat needs avcodec and avutil; avcodec needs swresample),
          # with ffmpeg's license, as the LGPL asks.
          foreach ($dll in "avformat-*.dll", "avcodec-*.dll", "avutil-*.dll", "swresample-*.dll") {
            Copy-Item "$env:RUNNER_TEMP\ffmpeg\bin\$dll" dist/
          }
          Copy-Item "$env:RUNNER_TEMP\ffmpeg\LICENSE.txt" dist/ffmpeg-LICENSE.txt
          # libmpv (the player), with where it comes from and its license.
          Copy-Item "$env:RUNNER_TEMP\mpv\bin\libmpv-2.dll" dist/
          Set-Content dist/libmpv-NOTICE.txt @(
            "libmpv-2.dll is mpv's player library (https://mpv.io), source: https://github.com/mpv-player/mpv",
            "This build: $env:MPV_URL (shinchiro/mpv-winbuild-cmake), SHA-256 $env:MPV_SHA256",
            "It includes GPL components, so it is licensed under the GNU GPL version 2 or later:",
            "https://www.gnu.org/licenses/old-licenses/gpl-2.0.html")
          Get-ChildItem dist | Select-Object -First 40 Name

      - name: Upload
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tyli-windows
          path: dist/
          retention-days: 14
