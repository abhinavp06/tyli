<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DSP Audio CSV Visualizer</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            background: radial-gradient(circle at top, #050505, #000000);
            color: #00ff9c;
            font-family: "VT323", monospace;
            padding: 20px;
        }

        h1 {
            text-shadow: 0 0 10px #00ff9c;
        }

        .panel {
            border: 1px solid #00ff9c;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(0,255,156,0.05);
            box-shadow: 0 0 12px rgba(0,255,156,0.3);
        }

        input, select {
            background: black;
            color: #00ff9c;
            border: 1px solid #00ff9c;
            padding: 6px;
            font-family: inherit;
        }

        canvas {
            background: black;
            border: 1px solid #00ff9c;
            box-shadow: 0 0 15px rgba(0,255,156,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            max-height: 260px;
            overflow: auto;
            display: block;
            margin-top: 10px;
        }

        td, th {
            border: 1px solid #00ff9c;
            padding: 4px;
            font-size: 14px;
        }

        .scanline {
            position: fixed;
            width: 100%;
            height: 2px;
            background: rgba(0,255,156,0.2);
            animation: scan 6s linear infinite;
        }

        @keyframes scan {
            from {
                top: 0;
            }

            to {
                top: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="scanline"></div>

    <h1>🎧 DSP AUDIO CSV VISUALIZER</h1>

    <div class="panel">
        <input type="file" id="fileInput" accept=".csv">
    </div>

    <div class="panel">
        X Axis:
        <select id="xSelect"></select>

        Y Axis:
        <select id="ySelect"></select>

        Chart Type:
        <select id="chartType">
            <option value="line">Waveform</option>
            <option value="scatter">Scatter</option>
            <option value="bar">Bar</option>
        </select>

        Max Points:
        <input type="range" id="maxPoints" min="100" value="2000">
        <span id="pointLabel"></span>
    </div>

    <div class="panel">
        <canvas id="chart" height="420"></canvas>
    </div>

    <div class="panel">
        <h3>CSV Preview</h3>
        <div id="tableContainer"></div>
    </div>

    <script>
        let rawData = [];
        let chart = null;

        const fileInput = document.getElementById("fileInput");
        const xSelect = document.getElementById("xSelect");
        const ySelect = document.getElementById("ySelect");
        const chartType = document.getElementById("chartType");
        const slider = document.getElementById("maxPoints");
        const label = document.getElementById("pointLabel");

        fileInput.addEventListener("change", loadCSV);
        xSelect.addEventListener("change", renderChart);
        ySelect.addEventListener("change", renderChart);
        chartType.addEventListener("change", renderChart);
        slider.addEventListener("input", renderChart);

        function loadCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => parseCSV(e.target.result);
            reader.readAsText(file);
        }

        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/);
            const headers = lines[0].split(",");

            rawData = lines.slice(1).map(row =>
                row.split(",").map(v => parseFloat(v))
            );

            populateDropdowns(headers);
            buildPreview(headers);
            renderChart();
        }

        function populateDropdowns(headers) {
            xSelect.innerHTML = "";
            ySelect.innerHTML = "";

            headers.forEach((h, i) => {
                xSelect.add(new Option(h, i));
                ySelect.add(new Option(h, i));
            });

            xSelect.selectedIndex = 0;
            ySelect.selectedIndex = headers.length > 1 ? 1 : 0;
        }

        function downsample(data, max) {
            if (data.length <= max) return data;
            const step = Math.floor(data.length / max);
            return data.filter((_, i) => i % step === 0);
        }

        function renderChart() {
            if (!rawData.length) return;

            const maxPoints = parseInt(slider.value);
            label.textContent = maxPoints;

            const sampled = downsample(rawData, maxPoints);

            const xIndex = parseInt(xSelect.value);
            const yIndex = parseInt(ySelect.value);

            const xVals = sampled.map(r => r[xIndex]);
            const yVals = sampled.map(r => r[yIndex]);

            const data = xVals.map((x, i) => ({ x, y: yVals[i] }));

            if (chart) chart.destroy();

            chart = new Chart(document.getElementById("chart"), {
                type: chartType.value,
                data: {
                    datasets: [{
                        label: "DSP Signal",
                        data,
                        borderColor: "#00ff9c",
                        backgroundColor: "rgba(0,255,156,0.2)",
                        pointRadius: chartType.value === "scatter" ? 2 : 0,
                        tension: 0.12
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        zoom: {
                            zoom: { wheel: { enabled: true }, mode: "xy" },
                            pan: { enabled: true, mode: "xy" }
                        },
                        tooltip: { enabled: true }
                    },
                    scales: {
                        x: { title: { display: true, text: "Sample / Time Index" } },
                        y: { title: { display: true, text: "Amplitude (Float)" } }
                    }
                }
            });
        }

        function buildPreview(headers) {
            const container = document.getElementById("tableContainer");
            container.innerHTML = "";

            const table = document.createElement("table");
            const thead = document.createElement("thead");
            const tr = document.createElement("tr");

            headers.forEach(h => {
                const th = document.createElement("th");
                th.textContent = h;
                tr.appendChild(th);
            });

            thead.appendChild(tr);
            table.appendChild(thead);

            const tbody = document.createElement("tbody");

            rawData.slice(0, 150).forEach(row => {
                const tr = document.createElement("tr");
                row.forEach(v => {
                    const td = document.createElement("td");
                    td.textContent = v;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            container.appendChild(table);
        }
    </script>

</body>
</html>
